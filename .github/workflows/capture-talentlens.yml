name: Capture TalentLens portfolio screenshots

on:
  push:
    branches:
      - content/talentlens-2026-redesign-showcase
    paths:
      - .github/workflows/capture-talentlens.yml
      - scripts/capture_talentlens_screens.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    name: Capture real TalentLens interface with fictional demo
    if: github.repository == 'adryanra97/alvin-homepage'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout portfolio branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Python for browser captures
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and image encoder
        run: |
          python -m pip install --disable-pip-version-check playwright pillow
          python -m playwright install --with-deps chromium
      - name: Capture actual deployed TalentLens and fictional demo
        env:
          TALENTLENS_CAPTURE_URL: https://talentlens.adryanrizkyalviano.me
        run: python scripts/capture_talentlens_screens.py
      - name: Verify all screenshots came from real views
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("public/projects/talent-estimation-agent/redesign-2026/capture-manifest.json")
          data = json.loads(p.read_text())
          expected = {"home", "journey", "process", "summary", "breakdown", "monthly", "capability", "ai-assist", "findings", "message", "catalog", "settings", "method", "about"}
          captured = {x["name"] for x in data["images"]}
          missing = expected - captured
          if not data["demo_completed"] or missing:
              raise SystemExit(f"Incomplete real screenshot set: {sorted(missing)}; demo={data['demo_completed']}")
          print("Verified", len(captured), "screenshots from the real application")
          PY
      - name: Commit screenshot assets to this branch
        run: |
          git config user.name "Adryan Rizky Alviano"
          git config user.email "73590164+adryanra97@users.noreply.github.com"
          git add public/projects/talent-estimation-agent/
          if git diff --cached --quiet; then
            echo "Screenshots already up to date"
          else
            git commit -m "assets: capture actual redesigned TalentLens screens [skip ci]"
            # The portfolio UI can continue changing while screenshots are captured.
            # Replay only the new image commit on top of the current feature branch.
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
