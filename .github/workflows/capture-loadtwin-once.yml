name: Capture LoadTwin real analysis screens (one-time)
on:
  push:
    branches:
      - feat/loadtwin-authentic-analysis-gallery-20261114
    paths:
      - .github/workflows/capture-loadtwin-once.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and screenshot tools
        run: |
          python -m pip install 'playwright==1.56.0' 'Pillow==11.3.0'
          python -m playwright install --with-deps chromium
      - name: Capture original LoadTwin application interfaces
        env:
          LOADTWIN_CAPTURE_URL: https://loadtwin.adryanrizkyalviano.me
        run: |
          python -u scripts/capture_loadtwin_screens.py
      - name: Commit genuine screenshots and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/projects/loadtwin/screens/
          git rm .github/workflows/capture-loadtwin-once.yml
          git commit -m 'assets: add actual LoadTwin analysis screenshots captured in Chromium'
          git push origin HEAD:feat/loadtwin-authentic-analysis-gallery-20261114
