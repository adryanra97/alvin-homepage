<text x="1315" y="47" fill="#9ac8d9" font-family="Arial,sans-serif" font-size="13" text-anchor="end" letter-spacing="2">ANALYTICAL EXAMPLE</text>
<text x="75" y="144" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#457287">THE CAPACITY QUESTION / 01</text>
<text x="71" y="217" font-family="Georgia,serif" font-size="62" fill="#0f2b42">When demand doubles,</text>
